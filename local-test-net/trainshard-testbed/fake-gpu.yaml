# A device the engine can hand a run when the machine has no cards. It adds nothing but a marker,
# which is enough for everything around the cards to be exercised for real.
cdiVersion: "0.6.0"
kind: "nvidia.com/gpu"
devices:
  - name: "0"
    containerEdits:
      env:
        - "FAKE_GPU=0"
  - name: "1"
    containerEdits:
      env:
        - "FAKE_GPU=1"
  - name: "all"
    containerEdits:
      env:
        - "FAKE_GPU=all"
